<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloj Analógico</title>
  <link rel="stylesheet" href="styles.css">

<script>
// CÓDIGO CON ERRORES INTENCIONALES

function actualizarReloj() {
  const ahora = new Date();
  
  const segundos = ahora.getSeconds();
  const minutos = ahora.getMinutes();
  const horas = ahora.getHours();

  // Cálculo de ángulos de rotación (360 grados por vuelta)
  const anguloSegundos = (segundos / 60) * 360; 
  const anguloMinutos = (minutos / 60) * 360;
  const anguloHoras = (horas % 12 / 12) * 360 + (minutos / 60) * 30;

  // Aplicación del estilo de rotación en el DOM
  document.getElementById("aguja-segundos").style.transform = `rotate(${anguloSegundos}deg)`;
  document.getElementById("aguja-minutos").style.transform = `rotate(${anguloMinutos}deg)`;
  document.getElementById("aguja-horas").style.transform = `rotate(${anguloHoras}deg)`;

}



</script>
<style>
  #reloj {
    width: 200px;
    height: 200px;
    border: 2px solid #000;
    border-radius: 50%;
    position: relative;
  }

  .aguja {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: bottom center;
    background-color: #000;
  }

  #aguja-horas {
    width: 6px;
    height: 60px;
    margin-left: -3px;
  }

  #aguja-minutos {
    width: 4px;
    height: 80px;
    margin-left: -2px;
  }

  #aguja-segundos {
    width: 2px;
    height: 90px;
    margin-left: -1px;
  }

  #centro {
    width: 10px;
    height: 10px;
    background-color: #000;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
  <div id="reloj">
    <div id="aguja-horas" class="aguja"></div>
    <div id="aguja-minutos" class="aguja"></div>
    <div id="aguja-segundos" class="aguja"></div>
    <div id="centro"></div>
  </div>

  <script>
    // Llamada inicial para actualizar el reloj
    actualizarReloj();
    // Actualización del reloj cada segundo
    setInterval(actualizarReloj, 1000);
  </script>
</body>
</html>
